            buildConfigField("String", "SITE_URL_SECOND","\"https://martoostaging.wpengine.com/\"")
            buildConfigField("String", "CONSUMER_KEY","\"ck_6c8c93e992e90543107de3f8cd8353f6a0c1b7a0\"")
            buildConfigField("String", "CONSUMER_SECRET","\"cs_e59904f09b82073ec9f8ef382d489a12611f9aa6\"")
